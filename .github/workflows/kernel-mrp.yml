name: Kernel MRP
run-name: "Kernel MRP (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# The MRP interop tests against microchip-ung/mrp, the Linux bridge's MRP
# with Microchip's daemon. It needs a kernel with CONFIG_BRIDGE_MRP and
# without CONFIG_NET_SWITCHDEV, which no hosted runner has: the job builds
# one (scripts/mrp-kernel.sh, cached) and runs the tests in a virtme-ng
# micro-VM with a Docker daemon inside (scripts/microvm-interop.sh). amd64
# only: GitHub's arm64 runners have no /dev/kvm.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:
    inputs:
      interop_ref:
        description: "profinet-interop ref to build the images from"
        required: false

permissions:
  contents: read

env:
  INTEROP_REF: ${{ inputs.interop_ref || 'v0.3.0' }}
  KERNEL: v6.12
  GOWORK: "off"

jobs:
  kernel-mrp:
    name: microchip-ung/mrp in a micro-VM
    runs-on: ubuntu-24.04   # arm64 runners have no /dev/kvm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"

      - name: KVM and virtme-ng
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils busybox-static udev flex bison bc libelf-dev libssl-dev >/dev/null
          pipx install virtme-ng

      - name: Kernel cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kernel/bzImage
          key: mrp-kernel-${{ env.KERNEL }}-${{ hashFiles('scripts/mrp-kernel.sh') }}

      - name: Build the kernel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          img=$(scripts/mrp-kernel.sh "$KERNEL" "$RUNNER_TEMP/src")
          mkdir -p "$RUNNER_TEMP/kernel" && cp "$img" "$RUNNER_TEMP/kernel/bzImage"

      - name: Build the reference images (the MRP peers and the decoders)
        run: |
          git clone --quiet https://github.com/otfabric/profinet-interop.git "$RUNNER_TEMP/profinet-interop"
          git -C "$RUNNER_TEMP/profinet-interop" checkout --quiet "$INTEROP_REF"
          make -C "$RUNNER_TEMP/profinet-interop" image-mrp image-umrp image-scapy image-tshark

      - name: MRP tests in the micro-VM
        run: scripts/microvm-interop.sh "$RUNNER_TEMP/kernel/bzImage" 'TestMRP.*/^mrp$'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-mrp-results
          path: interop-results/
