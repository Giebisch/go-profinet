name: Release

run-name: Release (${{ inputs.bump }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    uses: otfabric/.github/.github/workflows/go-package-release.yml@v2
    with:
      bump: ${{ inputs.bump }}
      release-name-prefix: go-profinet
      update-major-tag: false
      # As in CI: the shared workflow tests with -timeout=120s, which the
      # end-to-end suite outgrows; CI's e2e job and the soak cover it.
      test-exclude-regex: "(/example(s)?($|/)|/cmd($|/)|/e2e$)"
    secrets: inherit
